version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email_tester_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}
      - RATE_LIMIT_IP_REQUESTS=${RATE_LIMIT_IP_REQUESTS:-100}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    deploy:
      resources:
        limits:
          cpus: '${API_CPU_LIMIT:-1.5}'
          memory: '${API_MEM_LIMIT:-512M}'
        reservations:
          cpus: '${API_CPU_RESERV:-0.25}'
          memory: '${API_MEM_RESERV:-128M}'
    depends_on:
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    volumes:
      - api_data:/app/data
    tmpfs:
      - /tmp:exec,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: email_verifier_redis
    restart: unless-stopped
    user: "999:999"
    command: redis-server --save "" --appendonly no --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.5}'
          memory: '${REDIS_MEM_LIMIT:-256M}'
        reservations:
          cpus: '${REDIS_CPU_RESERV:-0.1}'
          memory: '${REDIS_MEM_RESERV:-64M}'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  api_data:
    driver: local
