name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-test:
    name: Code Quality, Type Safety & Empirical Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install ruff mypy pytest pytest-asyncio pytest-cov bandit

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check app scripts
          ruff format --check app scripts

      - name: Run Mypy Strict Type Analysis
        run: |
          mypy --strict app scripts

      - name: Run Bandit Security Audit
        run: |
          bandit -r app -c pyproject.toml

      - name: Run Pytest Test Suite & Coverage Report
        run: |
          pytest --cov=app --cov-report=term-missing

      - name: Execute Empirical Paper Test Suite & Export Artifacts
        run: |
          python -m app.tests.empirical_paper_suite

      - name: Upload Empirical Results (CSV & LaTeX)
        uses: actions/upload-artifact@v4
        with:
          name: empirical-paper-artifacts
          path: |
            empirical_results.csv
            empirical_results.tex
