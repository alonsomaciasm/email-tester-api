[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[project]
name = "email-tester-api"
version = "1.0.0"
description = "High-performance, Privacy & Security by Design Disposable Email Verification API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Backend & Security Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.4",
    "dnspython>=2.6.1",
    "pybloom-live>=4.0.0",
    "structlog>=24.2.0",
    "argon2-cffi>=23.1.0",
    "aiobreaker>=1.2.0",
    "idna>=3.7",
    "email-validator>=2.1.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "rapidfuzz>=3.9.0",
    "hiredis>=3.0.0",
    "granian>=1.4.0",
    "msgpack>=1.0.8",
    "zstandard>=0.22.0",
    "tiktoken>=0.7.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.3",
    "types-redis>=4.6.0.20240425",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # convention
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "UP",  # pyupgrade
]
ignore = ["S101", "S110"]  # allow assert statements in tests and try-except-pass in benchmarks

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pybloom_live",
    "pybloom_live.*",
    "pybloom",
    "pybloom.*",
    "aiobreaker",
    "aiobreaker.*",
    "dns.*",
    "prometheus_client",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security and privacy contract tests",
]

[tool.bandit]
exclude_dirs = ["app/tests"]
skips = ["B101"]
